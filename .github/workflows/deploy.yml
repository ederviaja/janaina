name: Deploy para cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Injetar SUPABASE_ANON_KEY
        run: |
          sed -i "s|COLOCA_AQUI_SUA_CHAVE_PUBLICA|${{ secrets.SUPABASE_ANON_KEY }}|g" index.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.ederviaja.com.br
          username: ederv1762154
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/janaina/
